<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSBC AI-Agent: Gold & Global Index (Cultural Edition)</title>
    <style>
        /* --- 核心视觉变量 --- */
        :root {
            --hsbc-red: #db0011;
            --hsbc-black: #2d2d2d;
            --hsbc-gray: #f4f4f4;
            --hsbc-white: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent-green: #008a3c;
            --accent-gold: #c6a87c; /* 黄金主题色 */
            --bg-dark: #1e1e1e;
            --app-bg: #f5f5f7;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: #cccccc;
            height: 100vh;
            display: flex;
            overflow: hidden;
            scroll-behavior: smooth;
        }

        /* --- 左侧：剧本与后台 --- */
        .story-panel {
            width: 55%;
            padding: 40px 40px 100px 40px;
            border-right: 1px solid #333;
            overflow-y: auto;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-title {
            font-size: 1.4rem; color: #fff; 
            border-bottom: 2px solid var(--hsbc-red); padding-bottom: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-badge { font-size: 0.7rem; background: #333; padding: 4px 8px; border-radius: 4px; color: var(--accent-gold); border: 1px solid var(--accent-gold); letter-spacing: 1px;}

        .scene-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #444;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            opacity: 0.3; transform: translateX(-10px);
            transition: all 0.6s ease;
        }

        .scene-card.active {
            opacity: 1; border-left-color: var(--hsbc-red);
            background: linear-gradient(90deg, rgba(219, 0, 17, 0.05) 0%, transparent 100%);
            transform: translateX(0);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .scene-header { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: flex; justify-content: space-between;}
        .scene-title { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .scene-desc { font-size: 0.95rem; color: #bbb; line-height: 1.5; margin-bottom: 15px; }

        .system-log {
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.75rem; background: #111; padding: 15px;
            border-radius: 6px; border: 1px solid #333; color: #aaa;
            line-height: 1.4;
        }
        .term-val { color: var(--accent-green); }
        .term-key { color: #2196f3; }
        .term-alert { color: var(--hsbc-red); }

        /* --- 右侧：手机模拟器 --- */
        .device-stage {
            width: 45%;
            background: #e5e5e5;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .phone-frame {
            width: 375px; height: 812px;
            background: #fff; border-radius: 45px;
            border: 8px solid #1a1a1a; position: relative; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }
        .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 32px; background: #1a1a1a; border-radius: 0 0 20px 20px; z-index: 999; }
        .status-bar { height: 44px; display: flex; justify-content: space-between; padding: 0 25px; align-items: center; font-size: 12px; font-weight: bold; color: #000; position: absolute; top:0; width: 100%; box-sizing: border-box; z-index: 900;}

        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
            background: var(--app-bg); animation: fadeIn 0.4s ease;
        }
        .screen.active { display: flex; }

        /* Notification - Dynamic Feel */
        .clean-notification {
            position: absolute; top: -140px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 14px; padding: 15px; z-index: 2000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 1px solid #f0f0f0;
            display: flex; gap: 12px; cursor: pointer; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 110px; overflow: hidden;
        }
        .clean-notification.show { top: 40px; }

        /* Chat Interface */
        .chat-app-header { 
            background: #fff; padding: 50px 20px 15px; border-bottom: 1px solid #eee; 
            display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); z-index: 500; 
            position: sticky; top: 0;
        }
        .header-title-center { 
            position: absolute; left: 50%; transform: translateX(-50%); text-align: center; 
        }
        .rm-avatar { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        .rm-avatar img { width: 100%; height: 100%; object-fit: contain; }
        
        .chat-body-light { flex: 1; background: var(--app-bg); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 150px; scroll-behavior: smooth;}
        
        .chat-input-bar { 
            position: absolute; bottom: 0; left: 0; right: 0; background: #fff; 
            padding: 10px 15px; border-top: 1px solid #e0e0e0; display: flex; align-items: center; gap: 10px; z-index: 500;
        }
        .chat-input-bar img { width: 28px; height: 28px; cursor: pointer; }
        .chat-input-field { 
            flex: 1; background: #f0f0f0; border-radius: 20px; padding: 12px 15px; 
            font-size: 0.95rem; color: #999; 
        }

        /* Bubbles - Glassmorphism touch */
        .bubble-light { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; opacity: 0; transform: translateY(10px); animation: popUp 0.4s forwards; box-shadow: 0 1px 2px rgba(0,0,0,0.05); position: relative; z-index: 100; }
        .bubble-light.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.95); color: #333333; border-bottom-left-radius: 4px; border: 1px solid #e5e5e5; }
        .bubble-light.user { align-self: flex-end; background: var(--hsbc-red); color: white; border-bottom-right-radius: 4px; }
        
        @keyframes popUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Widget Styles */
        .widget-card {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; margin-top: 5px;
        }
        .widget-title { font-size: 0.8rem; color: #666; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between;}
        .widget-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.85rem; color: #333; }
        .widget-bar { height: 6px; width: 100%; background: #eee; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .widget-bar-fill { height: 100%; background: var(--accent-gold); }
        .btn-action { width: 100%; padding: 10px; background: var(--hsbc-red); color: white; border: none; border-radius: 6px; margin-top: 10px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        
        .disclaimer { font-size: 0.6rem; color: #999; margin-top: 10px; line-height: 1.2; border-top: 1px solid #eee; padding-top: 5px; }

        /* Controls */
        .control-bar { position: fixed; bottom: 0; left: 0; width: 55%; padding: 20px 0; background: var(--bg-dark); border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 5000; }
        .next-btn { padding: 12px 30px; background: var(--accent-gold); color: #000; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-right: 30px;}
        .prev-btn { padding: 12px 30px; background: #666; color: #fff; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-left: 30px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="story-panel" id="storyPanel">
    <div class="header-title">
        <span>HSBC India Premier</span>
        <span class="header-badge">HSBC Wealth Sutra</span>
    </div>
</div>

<div class="device-stage">
    <div class="phone-frame">
        <div class="status-bar">
            <span>10:45</span>
            <span>Airtel 5G</span>
        </div>
        <div class="notch"></div>

        <div class="clean-notification" id="notif" onclick="userClicksNotification()">
            <div style="width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid #eee;">
               <img src="resource/IMG_1035.png" alt="HSBC" style="width: 30px; height: 30px; object-fit: contain;">
            </div>
            <div style="flex:1;">
                <div style="font-size:0.8rem; font-weight:bold; color:#000; display:flex; justify-content:space-between;">
                    <span>Market Insight</span> <span style="font-weight:normal; color:#888;">Now</span>
                </div>
                <div style="font-size:0.85rem; color:#333; margin-top:4px;">
                    Gold hits ₹1.23L. Is it a profit-taking moment or a family heritage 'Dhanya' protective move?
                </div>
            </div>
        </div>

        <div class="screen active" id="scr-chat">
            <div class="chat-app-header">
                <div class="rm-avatar">
                    <img src="resource/IMG_1035.png" alt="HSBC Logo">
                </div>
                <div class="header-title-center">
                    <div style="font-weight:bold; font-size:0.9rem; color:#333;">HSBC Wealth Sutra</div>
                    <div style="font-size:0.7rem; color:#008a3c;">● Structural Analysis Active</div>
                </div>
            </div>
            <div class="chat-body-light" id="chatBody"></div>
            <div class="chat-input-bar">
                <img src="resource/rm_india_2.png" alt="RM" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
                <div class="chat-input-field">Type a message...</div>
                <img src="resource/jianpan.png" alt="Keyboard">
                <img src="resource/jiahao.png" alt="More">
            </div>
        </div>
    </div>
</div>
    
<div class="control-bar">
    <button class="prev-btn" id="prevBtn" onclick="prevScene()" disabled>&lt; Previous</button>
    <button class="next-btn" id="nextBtn" onclick="nextScene()">Start Scenario</button>
</div>

<script>
    const script = [
        {
            phase: "1. Sense (感知)",
            title: "系统优化 vs 家族传统",
            desc: "Arjun 将 ₹1.23L 的高点视为系统优化的“卖出信号”，但家族视角将黄金视为安全保障的“核心内核”。AI 必须弥合这一二元对立。",
            log: `> Market: Gold Spot @ ₹1,23,000/10g\n> Context: System Optimization vs Heritage\n> Insight: Bridge 'Logical Exit' with 'Emotional Core'`,
            action: "show_notif"
        },
        {
            phase: "2. Understand (理解)",
            title: "负相关性：组合的‘防弹衣’",
            desc: "AI 不仅解释了资产对冲，还认可了黄金作为家庭安全网的地位，将其从单纯的“执念”重塑为“科学的系统冗余”。",
            log: `> Logic: Gold as 'Core Kernel' Redundancy\n> Discovery: Volatility Buffer vs US Tech\n> Strategy: Portfolio Resiliency Check`,
            action: "msg_stabilizer"
        },
        {
            phase: "3. Reflect (反思)",
            title: "穿透式视图：稳定性压力测试",
            desc: "通过“Asset Kundali”，AI 向量化展示了黄金如何作为波动率缓冲器。这直接呼应了技术架构师对系统鲁棒性的理解。",
            log: `> Analysis: Heritage vs Growth X-Ray\n> Metric: Volatility Buffer (+12% offset)\n> Hedge: Rupee Depreciation Resilience`,
            action: "msg_allocation"
        },
        {
            phase: "4. Deep Dive (探究)",
            title: "数字化‘箱底金’架构",
            desc: "建议 Arjun 采用混合策略：保留情感价值明显的实物金，将投资性增量转向流动性更强的 SGB 或 ETF，实现“架构升级”。",
            log: `> Solution: Digital Heritage Transformation\n> Efficiency: Zero Storage Cost + Tax Optimization\n> Asset: SGB Liquidity Analysis`,
            action: "msg_etf_vs_physical"
        },
        {
            phase: "5. Boundary (边界)",
            title: "合规建议：结构化对齐",
            desc: "AI 避开市场择时建议，转而通过模拟展示售出黄金对汇率避险的影响。强调 AI 负责结构分析，RM 负责战术决策。",
            log: `> Trigger: Market Timing Request\n> Policy: Structural Alignment Logic\n> Value: Currency Hedge Sensitivity`,
            action: "msg_boundary"
        },
        {
            phase: "6. Handoff (转接)",
            title: "从 Kundali 到行动议程",
            desc: "AI 为 RM 生成了一份“家族资产优化议程”，让下周的咖啡会面能直接进入执行阶段，而非重新解释逻辑。",
            log: `> Agenda: Heritage Asset Optimization\n> Handoff: AI Insight -> RM Strategy\n> Status: Context-aware handoff initiated`,
            action: "msg_finish"
        }
    ];

    let currentStep = 0;

    function nextScene() {
        if (currentStep >= script.length) return;
        
        const data = script[currentStep];
        const panel = document.getElementById('storyPanel');

        document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
        const card = document.createElement('div');
        card.className = 'scene-card active';
        card.innerHTML = `
            <div class="scene-header"><span>${data.phase}</span></div>
            <div class="scene-title">${data.title}</div>
            <div class="scene-desc">${data.desc}</div>
            <div class="system-log">${data.log.replace(/\n/g, '<br>')}</div>
        `;
        panel.appendChild(card);
        card.scrollIntoView({behavior: 'smooth'});

        if (data.action === "show_notif") {
            setTimeout(() => document.getElementById('notif').classList.add('show'), 500);
        }

        if (data.action === "msg_stabilizer") {
            addChat("user", "My logical side sees this ₹1.23L peak as a 'sell signal' for system optimization, but my wife views it as the family's 'Core Kernel'. How do I balance this?");
            setTimeout(() => addChat("ai", `
                Mr. Patel, as an architect, you know that the most resilient systems require <strong>Hardware Redundancy</strong>. In your portfolio, Gold isn't just an asset; it's the <strong>'Core Kernel'</strong> of your family’s security.
            `), 1000);
            setTimeout(() => addChat("ai", `
                My analysis shows your gold acts as a <strong>'Volatility Buffer'</strong>. When US Tech stocks face a drawdown, your gold traditionally provides a 30% inverse protection, keeping your overall system stable.
            `), 2000);
        }

        if (data.action === "msg_allocation") {
            addChat("user", "Show me my 'Stability Stress Test' view.");
            setTimeout(() => addChat("ai", `
                <div class="widget-card">
                    <div class="widget-title"><span>Asset Kundali: Resiliency View</span><span>Stable</span></div>
                    <div class="widget-row"><span>Growth (Tech/S&P 500)</span><span>65%</span></div>
                    <div class="widget-bar"><div class="widget-bar-fill" style="width:65%; background:#db0011;"></div></div>
                    <div class="widget-row"><span>Heritage Gold (The Buffer)</span><span>15%</span></div>
                    <div class="widget-bar"><div class="widget-bar-fill" style="width:15%"></div></div>
                    <div style="font-size:0.75rem; color:#333; font-weight:bold; margin-top:10px;">🛡️ Volatility Offset: +12.4%</div>
                    <div style="font-size:0.75rem; color:#666; margin-top:5px;">Your 'Heritage' assets are currently neutralizing Rupee volatility against your US tech holdings.</div>
                </div>
            `), 1000);
        }

        if (data.action === "msg_etf_vs_physical") {
            addChat("user", "I want to maintain this redundancy without the physical locker hassle. What’s the 'Tech Upgrade'?");
            setTimeout(() => addChat("ai", `
                I recommend a <strong>Hybrid Architecture</strong>: Retain the high-sentiment physical pieces as 'Stree Dhan', but migrate the investment weight to <strong>Sovereign Gold Bonds (SGBs)</strong>.
            `), 1000);
            setTimeout(() => addChat("ai", `
                SGBs offer a 2.5% annual coupon—essentially paying you to hold your safety net—while maintaining perfect correlation with gold prices.
            `), 2000);
        }

        if (data.action === "msg_boundary") {
            addChat("user", "Should I liquidate 20% right now to catch the Nasdaq dip?");
            setTimeout(() => addChat("ai", `
                <div class="widget-card" style="border-left:4px solid #db0011;">
                    <div class="widget-title" style="color:#db0011;">📊 Structural Impact Simulation</div>
                    <div style="font-size:0.85rem; color:#333;">
                        My logic is built for <strong>structural alignment</strong>, not market timing. 
                        <br><br>
                        If you liquidate 20% of your Gold, your system's vulnerability to INR/USD fluctuations increases by 15%. I recommend discussing this <strong>currency hedge risk</strong> with your RM before executing.
                    </div>
                    <div class="disclaimer">Simulated data based on historical INR/USD correlations. Past performance does not guarantee future hedge efficiency.</div>
                </div>
            `), 1500);
        }

        if (data.action === "msg_finish") {
             addChat("ai", "I’ve prepared a <strong>'Heritage Optimization Agenda'</strong> for your RM. It summarizes how to modernize your 'Locker Gold' while preserving its role as your family's safety net. Shall I book your coffee meeting for next Tuesday?");
             addChat("user", "Yes, that sounds like a solid plan. Let's sync with my RM.");
        }

        currentStep++;
        updateButtons();
    }

    function prevScene() {
        if (currentStep <= 0) return;
        const panel = document.getElementById('storyPanel');
        if (panel.children.length > 1) panel.lastElementChild.remove();
        const cards = panel.querySelectorAll('.scene-card');
        if (cards.length > 0) cards[cards.length-1].classList.add('active');

        const chatBody = document.getElementById('chatBody');
        let count = 0;
        while (chatBody.lastElementChild && count < 2) {
            chatBody.lastElementChild.remove();
            count++;
        }
        
        if (currentStep === 1) document.getElementById('notif').classList.remove('show');
        currentStep--;
        updateButtons();
    }

    function updateButtons() {
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        nextBtn.innerText = currentStep >= script.length ? "End of Scenario" : (currentStep === 0 ? "Start Scenario" : "Next Scene >");
        nextBtn.disabled = currentStep >= script.length;
        prevBtn.disabled = currentStep <= 0;
    }

    function userClicksNotification() {
        document.getElementById('notif').classList.remove('show');
        if (currentStep === 0) nextScene();
    }

    function addChat(type, html) {
        const body = document.getElementById('chatBody');
        const div = document.createElement('div');
        div.className = `bubble-light ${type}`;
        div.innerHTML = html;
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
    }
</script>

</body>
</html>
